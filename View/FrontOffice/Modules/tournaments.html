<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GameBridge | Tournaments</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* ===== TOURNAMENTS PAGE ===== */
    body {
      background: #0c0c0c;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
    }

    section {
      padding: 80px 10%;
      min-height: 100vh;
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent);
      margin-bottom: 25px;
    }

    /* ===== Active Tournaments ===== */
    .tournament-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      margin-bottom: 60px;
    }

    .tournament-card {
      background: var(--bg-card);
      border: 1px solid #1aff8720;
      border-radius: 12px;
      padding: 25px 20px;
      transition: 0.3s;
      box-shadow: 0 0 15px #00000055;
    }

    .tournament-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 25px #1aff8733;
      transform: translateY(-4px);
    }

    .tournament-card h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent);
      margin-bottom: 8px;
      font-size: 1.2rem;
    }

    .tournament-card p {
      color: #ccc;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .tournament-card button {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      border-radius: 6px;
      padding: 6px 18px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.3s ease;
      text-transform: uppercase;
    }

    .tournament-card button:hover {
      background: var(--accent);
      color: #000;
    }

    /* ===== Create Tournament Button ===== */
    .create-btn {
      display: inline-block;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
    }

    .create-btn:hover {
      background: #11cc66;
      transform: translateY(-3px);
    }

    /* ===== Modal (Popup) ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: 0.3s;
      z-index: 10;
    }

    .modal.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background: #111;
      border: 1px solid #1aff8720;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 0 30px #1aff8722;
      text-align: center;
      position: relative;
    }

    .modal-content h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .modal-content input,
    .modal-content textarea {
      width: 100%;
      background: #0c0c0c;
      border: 1px solid #1aff8720;
      border-radius: 8px;
      padding: 10px;
      color: var(--accent);
      margin-bottom: 15px;
      font-size: 0.95rem;
      transition: 0.3s;
    }

    .modal-content input:focus,
    .modal-content textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px #1aff8722;
      outline: none;
    }

    .modal-content button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    .modal-content button:hover {
      background: #11cc66;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 1.5rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .close-btn:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="../images/logo.png" alt="Logo">
    </div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="games.html">Games</a>
      <a href="tournaments.html"class="active">Tournaments</a>
      <a href="community.html">Community</a>
      <a href="users.html" >My Profile</a>
      <a href="feedback.html">Feedback</a>
      <a href="rewards.html" >Rewards</a>
    </nav>
  </header>

  <section>
    <h2> Active Tournaments</h2>

    <div class="tournament-grid">
      <div class="tournament-card">
        <h3>Pixel Clash</h3>
        <p>Prize: $200 • Players: 12/20</p>
        <button>Join</button>
      </div>
      <div class="tournament-card">
        <h3>Retro Rush</h3>
        <p>Prize: $150 • Players: 9/16</p>
        <button>Join</button>
      </div>
      <div class="tournament-card">
        <h3>Neon Cup</h3>
        <p>Prize: $500 • Players: 18/24</p>
        <button>Join</button>
      </div>
    </div>

    <div style="text-align:center; margin-top:40px;">
      <button class="create-btn" id="openModal">+ Create Tournament</button>
    </div>
  </section>

  <!-- ===== Modal Popup Form ===== -->
  <div class="modal" id="tournamentModal">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">&times;</button>
      <h3>Create Tournament</h3>
      <input type="text" placeholder="Tournament Name" required>
      <input type="text" placeholder="Prize (e.g. $200)">
      <input type="date" required>
      <textarea rows="3" placeholder="Description (optional)"></textarea>
      <button>Create</button>
    </div>
  </div>

  <script>
    // Modal open & close functionality
    const modal = document.getElementById('tournamentModal');
    const openBtn = document.getElementById('openModal');
    const closeBtn = document.getElementById('closeModal');

    openBtn.addEventListener('click', () => {
      modal.classList.add('active');
    });

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    // Close modal on outside click
    window.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });
  </script>
</body>
</html>
