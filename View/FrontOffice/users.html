<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GameBridge | All Users</title>
  <link rel="stylesheet" href="styleAdmin.css" />
  <style>
    /* ===== USER DASHBOARD PAGE ===== */
    body {
      background: #0c0c0c;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
    }

    section {
      padding: 80px 10%;
      min-height: 100vh;
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent);
      margin-bottom: 20px;
    }

    /* ===== Profile Header ===== */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 30px;
      background: var(--bg-card);
      border: 1px solid #1aff8720;
      border-radius: 16px;
      padding: 30px 40px;
      box-shadow: 0 0 20px #1aff8720;
      margin-bottom: 50px;
      flex-wrap: wrap;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 0 25px #1aff8722;
    }

    .profile-info h1 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent);
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .profile-info p {
      color: #aaa;
      margin-bottom: 8px;
    }

    .role-badge {
      display: inline-block;
      background: var(--accent);
      color: #000;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .xp-bar {
      background: #111;
      border: 1px solid #1aff8715;
      border-radius: 8px;
      overflow: hidden;
      width: 200px;
      height: 10px;
      margin-top: 10px;
      position: relative;
    }

    .xp-fill {
      background: var(--accent);
      height: 100%;
      width: 65%; /* dynamic */
      transition: width 0.4s ease;
    }

    /* ===== Dashboard Sections ===== */
    .dashboard-section {
      margin-bottom: 60px;
    }

    .dashboard-section h2 {
      border-left: 3px solid var(--accent);
      padding-left: 10px;
      margin-bottom: 25px;
    }

    /* ===== Games Grid ===== */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid #1aff8722;
      border-radius: 12px;
      padding: 20px;
      transition: 0.3s;
    }

    .game-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px #1aff8733;
      transform: translateY(-5px);
    }

    .game-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .game-card h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent);
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .game-card p {
      color: #aaa;
      font-size: 0.85rem;
    }

    /* ===== Tournaments & Feedback ===== */
    .list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .list-item {
      background: var(--bg-card);
      border: 1px solid #1aff8720;
      padding: 15px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.3s;
    }

    .list-item:hover {
      border-color: var(--accent);
      box-shadow: 0 0 15px #1aff8722;
    }

    .list-item span {
      color: var(--accent);
      font-weight: 600;
    }

    .list-item p {
      color: #ccc;
      font-size: 0.9rem;
    }

    /* ===== Achievements ===== */
    .achievements {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .badge {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      background: #111;
      border: 1px solid #1aff8722;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: 600;
      transition: 0.3s;
    }

    .badge:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px #1aff8722;
      transform: scale(1.05);
    }

    .badge i {
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #1aff8711;
      color: #888;
      font-size: 0.85rem;
      margin-top: 80px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="logo.png" alt="Logo">
    </div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="games.html">Games</a>
      <a href="tournaments.html">Tournaments</a>
      <a href="community.html">Community</a>
      <a href="my_profile.html">My Profile</a>
      <a href="feedback.html">Feedback</a>
      <a href="rewards.html">Rewards</a>
    </nav>
  </header>

  <!-- Users list only page -->
  <section style="padding:40px 10%;">
    <h2 style="font-family: 'Orbitron', sans-serif; color:var(--accent); margin-bottom:20px;">All Users</h2>
    <div id="users-list" class="games-grid"></div>
  </section>

  <footer>© 2025 GameBridge • Developed by Team UnityForge</footer>

  <script>
    (function(){
      const users = [
        {username:'LunaDev', display:'@LunaDev', role:'Developer', joined:'Jan 2024', level:8, xp:'820/1200', status:'Active'},
        {username:'Player123', display:'@Player123', role:'Player', joined:'May 2024', level:3, xp:'210/500', status:'Active'},
        {username:'AceGamer', display:'@AceGamer', role:'Developer', joined:'Jul 2023', level:12, xp:'1400/1500', status:'Suspended'},
        {username:'UnityForgeDev', display:'@UnityForgeDev', role:'Developer', joined:'Mar 2024', level:7, xp:'650/1000', status:'Active'}
      ];

      const container = document.getElementById('users-list');
      if(!container) return;

      function createCard(u, idx) {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <img src="${u.avatar}" alt="${u.display} avatar">
          <h3>${u.display}</h3>
          <p>${u.role} • Joined ${u.joined}</p>
          <p class="user-status" style="color:#888; font-size:0.95rem; margin-top:6px;">Status: <strong>${u.status}</strong></p>
          <p style="color:#888; font-size:0.85rem;">Level ${u.level} • XP: ${u.xp}</p>
          <div style="margin-top:10px; display:flex; gap:8px;">
            <a href="user_update.html?user=${u.username}" style="text-decoration:none"><button class="btn-update" style="padding:6px 10px; border-radius:6px; border:2px solid var(--accent); background:transparent; color:var(--accent);">Update</button></a>
            <button class="btn-delete" data-idx="${idx}" style="padding:6px 10px; border-radius:6px; border:2px solid #ff4d4d; background:transparent; color:#ff4d4d;">Delete</button>
          </div>
        `;
        return card;
      }

      users.forEach((u, i)=>{
        const card = createCard(u,i);
        container.appendChild(card);
      });

      // Delegate click for delete
      container.addEventListener('click', function(e){
        const btn = e.target.closest('.btn-delete');
        if(!btn) return;
        const idx = parseInt(btn.getAttribute('data-idx'),10);
        if(isNaN(idx)) return;
        const user = users[idx];
        if(!user) return;
        // Remove user from array and UI (simulate delete)
        users.splice(idx,1);
        const card = btn.closest('.game-card');
        if(card && card.parentNode) card.parentNode.removeChild(card);
        // Rebuild container indexes so data-idx remains consistent
        Array.from(container.querySelectorAll('.btn-delete')).forEach((b, i)=> b.setAttribute('data-idx', i));
      });
    })();
  </script>
 </body>
 </html>
