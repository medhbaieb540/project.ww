<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | GameBridge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbit"></div>

  <div class="container">
    <div class="logo">
      <img class="logo-img" src="../images/logo.png" alt="GameBridge Logo" />
      <div class="logo-text">GameBridge</div>
    </div>

    <div class="badge">
      <span class="icon">★</span>
      Members-only access to reviews & news
    </div>

  <h1>Welcome to GameBridge!</h1>
    <p class="subtitle">Log in to continue to your dashboard, reviews & game discussions.</p>

    <form id="loginForm">
      <div>
        <div class="field-label">Email or Username</div>
        <div class="input-wrap">
          <input type="text" id="username" placeholder="example@GameBridge.com" required />
          <span class="input-icon">👤</span>
        </div>
      </div>

      <div>
        <div class="field-label">Password</div>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" required />
          <span class="input-icon">🔒</span>
        </div>
      </div>

      <div class="row">
        <label class="remember">
          <input type="checkbox" id="remember" />
          Remember me
        </label>
        <a href="forget_password.html" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary">Log In</button>
      <div id="status" class="status"></div>

      <div class="divider">
        <span></span><p>or continue with</p><span></span>
      </div>

      <div class="socials">
        <button type="button" class="social-btn"><span>G</span> Google</button>
        <button type="button" class="social-btn"><span></span> Apple</button>
        <button type="button" class="social-btn"><span>♛</span> Discord</button>
      </div>

      <p class="signup-text">
        New here?
        <a href="create_account.html">Create account</a>
      </p>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        status.textContent = "Please fill in all fields.";
        status.className = "status error";
        return;
      }

      status.textContent = "Sending data to server...";
      status.className = "status";

      setTimeout(() => {
        status.textContent = "Demo mode: hook this form to your backend to complete login.";
        status.className = "status success";
      }, 600);
    });
  </script>
</body>
</html>
