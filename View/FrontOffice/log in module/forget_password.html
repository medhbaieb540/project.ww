<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password | GameBridge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbit"></div>

  <div class="container">
    <div class="logo">
      <img class="logo-img" src="../images/logo.png" alt="GameBridge Logo" />
      <div class="logo-text">GameBridge</div>
    </div>

    <h1>Forgot your password?</h1>
    <p class="subtitle">Enter the email address on your account and we'll send a link to reset your password.</p>

    <form id="resetForm">
      <div>
        <div class="field-label">Email address</div>
        <div class="input-wrap">
          <input type="email" id="resetEmail" placeholder="you@example.com" required />
          <span class="input-icon">✉️</span>
        </div>
      </div>

      <button type="submit" class="btn-primary">Send Reset Link</button>

      <div id="resetStatus" class="status"></div>

      <p class="signup-text">
        Remembered your password?
        <a href="login.html">Back to login</a>
      </p>
    </form>
  </div>

  <script>
    const form = document.getElementById('resetForm');
    const status = document.getElementById('resetStatus');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('resetEmail').value.trim();
      if (!email) {
        status.textContent = 'Please enter your email address.';
        status.className = 'status error';
        return;
      }

      // Basic email pattern check
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        status.textContent = 'Please enter a valid email address.';
        status.className = 'status error';
        return;
      }

      status.textContent = 'Sending reset link...';
      status.className = 'status';

      // Demo: simulate server response
      setTimeout(() => {
        status.textContent = 'If an account with that email exists, a reset link has been sent.';
        status.className = 'status success';
      }, 800);
    });
  </script>
</body>
</html>
