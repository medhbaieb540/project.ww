<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account | GameBridge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orbit"></div>

  <div class="container">
    <div class="logo">
      <img class="logo-img" src="../images/logo.png" alt="GameBridge Logo" />
      <div class="logo-text">GameBridge</div>
    </div>

    <h1>Create your account</h1>
    <p class="subtitle">Join GameBridge to post reviews, follow discussions and get personalised recommendations.</p>

    <form id="signupForm">
      <div>
        <div class="field-label">Username</div>
        <div class="input-wrap">
          <input type="text" id="signupUsername" placeholder="gamer123" required />
          <span class="input-icon">👤</span>
        </div>
      </div>

      <div>
        <div class="field-label">Email</div>
        <div class="input-wrap">
          <input type="email" id="signupEmail" placeholder="you@example.com" required />
          <span class="input-icon">✉️</span>
        </div>
      </div>

      <div>
        <div class="field-label">Password</div>
        <div class="input-wrap">
          <input type="password" id="signupPassword" placeholder="Create a strong password" required />
          <span class="input-icon">🔒</span>
        </div>
      </div>

      <div>
        <div class="field-label">Confirm password</div>
        <div class="input-wrap">
          <input type="password" id="signupConfirm" placeholder="Repeat password" required />
          <span class="input-icon">🔒</span>
        </div>
      </div>

      <div>
        <div class="field-label">Account type</div>
        <div class="input-wrap">
          <select name="accountType" id="roleSelect" required>
            <option value="" disabled selected hidden>Select account type</option>
            <option value="player">🎮 Player</option>
            <option value="developer">💻 Developer</option>
          </select>
        </div>
      </div>

      <label class="remember" style="margin:10px 0; display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="terms" />
        I agree to the <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>
      </label>

      <button type="submit" class="btn-primary">Create account</button>

      <div id="signupStatus" class="status"></div>

      <p class="signup-text">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>

      <p class="signup-text">
        Forgot password?
        <a href="forget_password.html">Reset it</a>
      </p>
    </form>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const status = document.getElementById('signupStatus');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const username = document.getElementById('signupUsername').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;
    const terms = document.getElementById('terms').checked;
    const roleSelect = document.getElementById('roleSelect');
    const role = roleSelect ? roleSelect.value : '';

      if (!username || !email || !password || !confirm) {
        status.textContent = 'Please fill in all fields.';
        status.className = 'status error';
        return;
      }

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        status.textContent = 'Please enter a valid email address.';
        status.className = 'status error';
        return;
      }

      if (password.length < 8) {
        status.textContent = 'Password must be at least 8 characters.';
        status.className = 'status error';
        return;
      }

      if (password !== confirm) {
        status.textContent = 'Passwords do not match.';
        status.className = 'status error';
        return;
      }

      if (!terms) {
        status.textContent = 'You must agree to the terms to create an account.';
        status.className = 'status error';
        return;
      }

      if (!role) {
        status.textContent = 'Please select an account type (Player or Developer).';
        status.className = 'status error';
        return;
      }

      status.textContent = 'Creating account...';
      status.className = 'status';

      // Demo: simulate server call
      setTimeout(() => {
        const roleName = role.charAt(0).toUpperCase() + role.slice(1);
        status.textContent = `Account created (demo) as ${roleName}. Please check your email to verify your account.`;
        status.className = 'status success';
      }, 900);
    });
  </script>
</body>
</html>
